version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_DSN=redis://redis:6379/0
      - POSTGRES_DSN=postgresql+asyncpg://user:pass@db:5432/mydb
      - TELEGRAM_BOT_TOKEN=yourtokenhere
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"